<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키보드 하이랜더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;700&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Gothic+Coding:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* 갈무리(Galmuri) by Minseo Lee — SIL Open Font License 1.1 (fonts/LICENSE-Galmuri.md). 게임에 나오는 글자만 골라 담은 파일 */
@font-face{font-family:"GalmuriMono11";src:url("fonts/GalmuriMono11.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Galmuri11 Bold";src:url("fonts/Galmuri11-Bold.woff2") format("woff2");font-display:swap}
/* Layout: 내 작업대 = 마크다운 에디터(탭·줄번호·프론트매터). 그 사이에 끼는 게시판 창만 의뢰별 플랫폼 스킨. */
:root{
  --bg:#1b1b1f; --pane:#232328; --tab:#17171b; --line:#34343b; --ink:#dcdde2; --dim:#868995; --head:#f3f4f8;
  --acc:#a58bff; --str:#e6b673; --key:#7fd1b9; --warn:#f2777a; --ok:#9fd38a; --cm:#6f8f6c;
  --hi:var(--acc); --foe:#7fb7ff; --cash:var(--str);
  /* 내 세계(제목·작업대·선택지·엔딩)는 한글 도트 폰트 갈무리. 게시판·가족 단톡방은 진짜 웹처럼 일반 고딕 그대로.
     갈무리 파일이 없는 곳(claude.ai 아티팩트)에서는 뒤의 폰트로 자동 대체 */
  --f-title:"Galmuri11 Bold","Black Han Sans","Nanum Gothic Coding",sans-serif;
  --f-body:"GalmuriMono11","JetBrains Mono","Nanum Gothic Coding",ui-monospace,monospace;
  --f-num:"GalmuriMono11","JetBrains Mono","Nanum Gothic Coding",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
*{box-sizing:border-box}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* 에디터 창 */
.win{background:var(--pane);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.win>.bar{background:var(--tab);display:flex;align-items:stretch;font-size:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.win>.bar>span{padding:6px 12px;color:var(--dim)}
.win>.bar>span:first-child{background:var(--pane);color:var(--ink);border-top:2px solid var(--acc)}
.win>.bar>span:first-child::before{content:"📄 "}
.win>.bar>span:first-child::after{content:"  ×";color:var(--dim)}
.win>.bar>span:last-child:not(:first-child){margin-left:auto}
.win>.bar>span.ghost{margin-left:0!important;background:transparent;border-top:2px solid transparent}
.win>.bar>span.ghost::before{content:"📄 "}
.win>.body{position:relative;padding:16px 16px 16px 54px;min-width:0}
.win>.body::before{content:"1\A 2\A 3\A 4\A 5\A 6\A 7\A 8\A 9\A 10\A 11\A 12\A 13\A 14\A 15\A 16\A 17\A 18\A 19\A 20\A 21\A 22\A 23\A 24\A 25\A 26\A 27\A 28\A 29\A 30\A 31\A 32\A 33\A 34\A 35\A 36\A 37\A 38\A 39\A 40\A 41\A 42\A 43\A 44\A 45\A 46\A 47\A 48\A 49\A 50\A 51\A 52\A 53\A 54\A 55\A 56\A 57\A 58\A 59\A 60\A 61\A 62\A 63\A 64\A 65\A 66\A 67\A 68\A 69\A 70\A 71\A 72\A 73\A 74\A 75\A 76\A 77\A 78\A 79\A 80\A 81\A 82\A 83\A 84\A 85\A 86\A 87\A 88\A 89\A 90\A 91\A 92\A 93\A 94\A 95\A 96\A 97\A 98\A 99\A 100\A 101\A 102\A 103\A 104\A 105\A 106\A 107\A 108\A 109\A 110\A 111\A 112\A 113\A 114\A 115\A 116\A 117\A 118\A 119\A 120";white-space:pre;position:absolute;left:0;top:16px;bottom:0;width:40px;overflow:hidden;
  text-align:right;padding-right:10px;color:#4a4c55;font-size:12px;line-height:1.98;border-right:1px solid var(--line);pointer-events:none}

/* 마크다운 미리보기 문법 */
h1{font-family:var(--f-title);font-weight:400;font-size:clamp(38px,10vw,58px);line-height:1.05;margin:0;color:var(--head)}
h1::before{content:"# ";color:var(--dim);font-family:var(--f-body);font-size:.5em;vertical-align:middle}
h2{font-weight:700;font-size:20px;margin:0;color:var(--head);text-wrap:balance}
h2::before{content:"## ";color:var(--dim)}
h3{font-weight:700;font-size:14px;margin:6px 0 0;color:var(--head)}
h3::before{content:"### ";color:var(--dim)}
p{margin:0}
b{color:var(--head)}
.dim,.cmt{color:var(--dim)}
.cmt{color:var(--cm)}
.num{font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums;color:var(--str)}
.key{color:var(--key)}
.str{color:var(--str)}
code,.code{font-family:var(--f-body);background:#ffffff0d;padding:0 4px;border-radius:3px}
button{font:inherit;color:inherit;cursor:pointer}
.btn.settle{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--acc);color:var(--bg);border-color:var(--acc);text-align:left}
.btn.settle[hidden]{display:none}
.btn.settle small{font-weight:400;font-size:12px;opacity:.85}
.btn{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:4px;font-weight:700;padding:8px 14px;font-size:14px}
.btn::before{content:"▶ "}
.btn:hover{background:var(--acc);color:var(--bg)}
.btn.alt{color:var(--dim);border-color:var(--line)}
.btn.alt::before{content:"? "}
.btn.alt:hover{background:var(--line);color:var(--ink)}
button:focus-visible,.c.foe.open:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
canvas.sprite{image-rendering:pixelated;width:160px;max-width:100%;height:auto;border:1px solid var(--line);background:#2b2b32;padding:8px}

/* 콜아웃 (> [!note]) */
.memo{border-left:3px solid var(--acc);background:#a58bff12;border-radius:0 4px 4px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.memo .k{font-size:12px;color:var(--acc);font-weight:700}
.memo .k::before{content:"ⓘ "}
.big{font-size:15px;font-weight:700;color:var(--head)}

/* 의뢰인 사다리 */
.ladder{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;align-items:center}
.ladder div{padding:1px 6px;border-radius:3px;background:#ffffff0d;color:var(--dim)}
.ladder div:not(:last-child)::after{content:" →";color:#4a4c55}
.ladder .done{color:var(--ok);text-decoration:line-through}
.ladder .now{background:var(--acc);color:var(--bg);font-weight:700}

/* 프론트매터 HUD */
.prog{flex-wrap:nowrap!important;white-space:nowrap}
.prog code{overflow:hidden;min-width:0;flex:0 1 auto}
.prog>span:first-child{min-width:5.5em!important;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.mini span{white-space:nowrap} .mini b{color:var(--head)}
.toasts{display:flex;flex-direction:column;gap:4px}
.toast{font-size:13px;padding:6px 8px;border-left:4px solid #e0464f;background:#ffffff0a;border-radius:3px;color:var(--ink)}
.toast.evt{border-left-color:#f5a500} .toast.buy{border-left-color:#2e9e5b}
.toast.old{opacity:.55;font-size:12px}
.ggrid.tools{grid-template-columns:repeat(3,1fr);gap:6px}
.ggrid.tools .tile{padding:8px;gap:4px}
.ggrid.tools .tile .ic{width:30px;height:30px;font-size:17px}
.ggrid.tools .tile .nm{font-size:12px}
.ggrid.tools:not(.showfx) .fxs{display:none}
.fxbtn{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--dim)}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 18px;font-size:13px}
.fm .cm{grid-column:1/-1;color:var(--dim)}
.prog{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.prog>span:first-child{min-width:7.5em;color:var(--key)}
.prog code{color:var(--str);letter-spacing:-1px;white-space:pre;background:none;padding:0}
.prog code.w{color:var(--warn)}
.buffs{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.buffs span{background:#ffffff0d;padding:0 6px;border-radius:3px}
.cash{color:var(--str)!important}

/* 조작 패널 */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--ink)}
.chip img{width:16px;height:16px;image-rendering:pixelated}
.chip.on{border-color:var(--acc);color:var(--acc);background:#a58bff14}
.chip small{color:var(--key);font-size:11px}
.chip .hot{color:var(--warn)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 12px}
.act{background:transparent;border:0;border-radius:3px;padding:4px 6px;text-align:left;display:flex;flex-direction:column;gap:0;color:var(--ink)}
.act:hover:not(:disabled){background:#ffffff0a}
.act b{font-size:13px;font-weight:400;color:var(--ink)}
.act b::before{content:"- [ ] ";color:var(--dim)}
.act span{font-size:11px;color:var(--cm);padding-left:6ch}
.act .cost{color:var(--str)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.locked b{color:var(--dim)}
.act.good b{color:var(--ok)}
.act.good b::before{content:"- [x] ";color:var(--ok)}
#tgt{font-size:13px;min-height:1.5em}
.status{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--dim);background:var(--tab);padding:3px 10px;border:1px solid var(--line);border-radius:6px}
.status .br{color:var(--acc)}

.unlock{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.unlock div{border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column}
.unlock span{font-size:12px;color:var(--cm)}
.unlock span.cash::before{content:"cost: "}
.legend{display:flex;flex-direction:column;gap:2px;font-size:13px}
.legend span::before{content:"- ";color:var(--dim)}
.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay .win{max-width:520px;width:100%;box-shadow:0 10px 40px #000}
.line{opacity:0;animation:fadein .6s forwards}
@keyframes fadein{to{opacity:1}}
.ending p{font-size:15px}
.ending p::before{content:"> ";color:var(--dim)}
.ending .final{font-family:var(--f-title);font-size:24px;color:var(--head)}
.ending .final::before{content:""}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:13px}
.stats .dim::before{content:"| "}

/* 게시판 공통 */
.c{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;animation:pop .25s steps(3);padding:4px;border:2px solid transparent}
.c img{width:28px;height:28px;image-rendering:pixelated}
.c .n{font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.c.foe.open{cursor:pointer}
.c.foe.done>.x>.t{text-decoration:line-through;opacity:.55}
.c.sys,.c.evt,.c.buy{grid-template-columns:1fr;padding:6px 8px;border-left:4px solid #e0464f;font-size:13px}
.c.evt{border-left-color:#f5a500}
.c.buy{border-left-color:#2e9e5b}
.c .x{min-width:0;overflow-wrap:anywhere}
.tag{font-size:11px;padding:0 5px}
.replies{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding-left:10px;border-left:2px solid}
.replies .c{grid-template-columns:20px 1fr;padding:0;border:0}
.replies .c img{width:20px;height:20px}
.feed{height:min(40vh,340px);overflow-y:auto;display:flex;flex-direction:column;gap:6px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:420px){.win>.body{padding-left:16px}.win>.body::before{display:none}.act span{padding-left:0}}

/* 플랫폼 스킨: 게시판 창만 의뢰마다 바뀜 (내 작업대는 마크다운 에디터 그대로) */
.board{--b-bg:#fff;--b-ink:#222;--b-dim:#777;--b-line:#e3e3e3;--b-top:#333;--b-topink:#fff;--b-acc:#3b4890;--b-me:#c2410c;--b-foe:#1d4ed8;--b-card:#f6f7f9;--b-sel:#fff6cc;
  --b-font:"Nanum Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--b-bg);color:var(--b-ink);font-family:var(--b-font);font-size:14px;line-height:1.55;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.board .addr{background:#d6d6d6;color:#333;display:flex;gap:10px;align-items:center;padding:4px 8px;font-size:12px;font-family:system-ui,-apple-system,"Segoe UI","Nanum Gothic",sans-serif}
.board .addr .u{background:#fff;border:1px solid #999;padding:1px 8px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .addr .dots{color:#e0464f;letter-spacing:2px}
.b-top{background:var(--b-top);color:var(--b-topink);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.b-top .logo{font-size:19px;font-weight:800;letter-spacing:-.5px}
.b-post{padding:12px;border-bottom:1px solid var(--b-line);display:flex;flex-direction:column;gap:4px}
.b-post .t{font-weight:800;font-size:17px;line-height:1.4;text-wrap:balance}
.board .m{font-size:12px;color:var(--b-dim)}
.b-cmt{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--b-line);display:flex;gap:6px;flex-wrap:wrap}
.b-cmt .hint{color:var(--b-dim);margin-left:auto}
.board .feed{padding:8px 12px}
.board b{color:inherit}
.board .c .n{color:var(--b-dim);font-weight:700}
.board .c.me .n{color:var(--b-me)}
.board .c.foe .n{color:var(--b-foe)}
.board .c .meta{font-size:11px;color:var(--b-dim);margin-top:2px}
.board .c.foe.open{background:var(--b-card)}
.board .c.foe.open:hover{border-color:var(--b-line)}
.board .c.foe.sel{border-color:var(--b-acc);background:var(--b-sel)}
.board .tag{background:var(--b-ink);color:var(--b-bg)}
.board .hp{color:#e0464f}
.board .replies{border-left-color:var(--b-line)}
.board .c.sys,.board .c.evt,.board .c.buy{background:var(--b-card);color:var(--b-ink)}
.board .c img{border:0}
.board .thumb{image-rendering:pixelated;display:block;height:auto;max-width:100%}
.board .star{color:#ff9f0a}

.skin-gall{--b-top:#3b4890;--b-acc:#3b4890;--b-me:#3b4890;--b-foe:#333;--b-card:#fff;--b-line:#e5e5e5;--b-sel:#eef1ff;--b-dim:#999;font-size:13px}
.g-head{background:#3b4890;color:#fff;display:flex;align-items:baseline;gap:10px;padding:9px 12px;flex-wrap:wrap}
.g-head .logo{font-size:17px;font-weight:800;letter-spacing:-1px}
.g-head .gname{font-size:15px;font-weight:700}
.g-head .gname small{font-size:11px;font-weight:400;opacity:.8;margin-left:4px}
.g-tabs{display:flex;gap:0;border-bottom:2px solid #3b4890;font-size:12px}
.g-tabs span{padding:6px 12px;color:#666}
.g-tabs .on{background:#3b4890;color:#fff;font-weight:700}
.g-post{padding:0 12px 12px;border-bottom:1px solid #e5e5e5}
.g-title{padding:10px 0 6px;font-size:15px;font-weight:700;border-bottom:1px solid #e5e5e5;line-height:1.4}
.g-title .mh{color:#3b4890;margin-right:4px}
.g-info{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:#999;padding:6px 0;border-bottom:1px solid #e5e5e5}
.g-info .w{color:#333;font-weight:700}
.g-info .r{margin-left:auto}
.g-body{padding:14px 0 6px;font-size:14px;line-height:1.75;color:#222}
.g-art{display:flex;flex-direction:column;gap:4px;margin:10px 0 0;align-items:flex-start}
.g-art canvas{width:256px;max-width:100%;height:auto;image-rendering:pixelated;border:1px solid #e1e1e1}
.g-art span{font-size:11px;color:#999}
.g-vote{display:flex;justify-content:center;gap:10px;padding:10px 0 4px}
.g-vote div{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:6px 10px;border:1px solid #ccc;border-radius:3px}
.g-vote b{font-size:20px;line-height:1.2}
.g-vote .up b{color:#d31900}
.g-vote .down b{color:#3b4890}
.g-vote span{font-size:11px;color:#666}
.skin-gall .b-cmt{background:#f8f8f8;border-top:2px solid #3b4890}
.skin-gall .b-cmt b{color:#d31900}
.skin-gall .feed{padding:0}
.skin-gall .feed{gap:0}
.skin-gall .c{grid-template-columns:1fr;border:0;border-bottom:1px solid #eee;padding:7px 12px;border-radius:0}
.skin-gall .c>img,.skin-gall .replies .c>img{display:none}
.skin-gall .c>.x{display:grid;grid-template-columns:minmax(96px,128px) 1fr auto;gap:2px 10px;align-items:baseline}
.skin-gall .c .n{font-weight:700;color:#333;flex-wrap:wrap;gap:4px}
.skin-gall .c.me .n{color:#333}
.skin-gall .c .t{color:#333}
.skin-gall .c .meta{grid-column:3;grid-row:1;margin:0;color:#aaa}
.skin-gall .c .replies{grid-column:1/-1;border-left:0;background:#f8f8f8;margin:6px -12px -7px;padding:0;gap:0}
.skin-gall .replies .c{padding:6px 12px 6px 28px;border-bottom:1px solid #eee;position:relative;background:transparent}
.skin-gall .replies .c::before{content:"ㄴ";position:absolute;left:12px;top:6px;color:#bbb}
.skin-gall .ip{font-weight:400;color:#999;font-size:11px}
.skin-gall .gonik{color:#3b4890;font-size:10px;margin-left:2px}
.skin-gall .tag{background:#eef1ff;color:#3b4890;font-weight:400}
.skin-gall .c.foe.sel{background:#eef1ff;box-shadow:inset 3px 0 0 #3b4890}
.skin-gall .c.sys,.skin-gall .c.evt,.skin-gall .c.buy{padding:6px 12px;border-bottom:1px solid #eee}
@media (max-width:520px){.skin-gall .c>.x{grid-template-columns:1fr auto}.skin-gall .c .n{grid-column:1}.skin-gall .c .meta{grid-column:2}.skin-gall .c .t{grid-column:1/-1}}

.skin-forum{--b-bg:#14171f;--b-ink:#e8eaf0;--b-dim:#8a90a2;--b-line:#2a2f3c;--b-top:#1d212b;--b-topink:#fff;--b-acc:#ff8a00;--b-me:#ffb547;--b-foe:#7aa7ff;--b-card:#1b1f29;--b-sel:#2b2416}
.skin-forum .logo{color:#ff8a00}
.skin-forum .badge{align-self:flex-start;background:#ff3b30;color:#fff;font-size:11px;padding:1px 6px;font-weight:700}
.skin-forum .c{border-radius:6px}

.skin-blog{--b-top:#fff;--b-topink:#222;--b-acc:#19c45c;--b-me:#0f9d48;--b-foe:#555;--b-card:#f7faf8;--b-sel:#e8fbef}
.skin-blog .b-top{border-bottom:1px solid var(--b-line)}
.skin-blog .logo{color:#19c45c}
.skin-blog .b-post .t{font-size:21px;font-weight:400}

    <p>1. 게시판에서 <b>상대 댓글을 눌러</b> 대상으로 고르세요. 답하지 않은 상대 댓글은 매 턴 여론을 깎습니다.</p>
    <p>2. 상대 댓글 유형에 맞는 <b>대응법</b>을 고르세요. 상성이 맞으면 한 방에 잠재우고, 틀리면 역효과가 납니다.</p>
    <div class="legend">
      ${Object.keys(TACTICS).map(k=>`<span>${TACTICS[k].icon} ${TACTICS[k].name} → ${typeList(k)}에 강함${weakList(k)?' · '+weakList(k)+'엔 역효과':''}</span>`).join('')}
    </div>
    <p>3. 부계정마다 <b>말투</b>가 다릅니다. 같은 계정을 연달아 쓰면 의심받아요.</p>
    <p>4. 의뢰를 성공하면 <b>레벨 업</b>. 더 큰 의뢰인이 찾아오고, 새 도구가 열립니다. 돈 드는 도구는 의뢰인이 준 <b>작전비</b>에서만 빠지고(내 지갑 돈은 못 씀), 남은 작전비는 절반만 당신 몫이에요(나머지는 반납). 비싼 도구는 의뢰당 한 번만 쓸 수 있어요.</p>
    <p>+ 선택 장면이 지나고 목표를 넘겼다면 <b>지금 정산하기</b>로 일찍 끝낼 수 있어요. 남은 턴만큼 보너스가 붙어요.</p>
    <p>+ 다음 의뢰로 넘어갈 때마다 <b>청구서</b>가 와요. 많이 벌수록 씀씀이도 커져요.</p>
    <p>+ 게시판마다 <b>그 플랫폼 전용 행동</b>이 하나씩 있어요(념글 보내기, 별점 1점 테러, 싫어요 폭격 등). 무료지만 턴을 하나 쓰고, 한 번 쓰면 3턴을 기다려야 해요.</p>
    <p>5. 의심도가 100이 되면 방금 쓴 계정이 정지됩니다. 계정이 0개가 되거나 같은 의뢰를 두 번 연속 망치면 끝.</p>
    <div class="row"><button class="btn" id="go">알겠음</button></div>
  </div></div>`;
  $('#go').onclick = () => screenTitle(false);
}

/* ---------- 의뢰서 ---------- */

  const d = ROUNDS[S.r];
  $('#app').innerHTML = `
  <div class="win"><div class="bar"><span>의뢰_0${S.r+1}.md${S.fails?' (재도전)':''}</span><span class="num">${won(S.money)}</span></div>
  <div class="body stack">
    ${ladder()}
    <div class="memo">
      <span class="k">의뢰인 · ${esc(d.tier)}</span><span class="big">${esc(d.client)}</span>
      <span>${esc(d.ask)}</span>
      <span class="k">작업 장소 · ${esc(SKINS[d.skin].place)} 「${esc(SKINS[d.skin].name)}」</span><span>${esc(d.title)}</span>
      <span class="k">목표</span><span><b>${d.turns}턴</b> 안에 「${esc(d.S)}」 여론을 <b>${d.target}%</b> 이상으로</span>
      <span class="k">성공 보수 / 작전비</span><span class="big">${d.payNote ? esc(d.payNote) + ' (' + won(d.pay) + ')' : won(d.pay)} / ${d.budget ? won(d.budget) : '없음'}</span>

    <div class="row"><button class="btn" id="go">로그인</button></div>
  </div></div>`;

/* ---------- 플레이 ---------- */
function startRound(){
  const d = ROUNDS[S.r];
  // 이 의뢰를 처음 시작할 때 상태를 저장. 재도전하면 여기로 되돌림
  if (S.cpR !== S.r){ S.cpR = S.r; S.cp = JSON.parse(JSON.stringify({accs:S.accs, sus:S.sus, money:S.money, karma:S.karma, crossed:S.crossed, usedPersonas:S.usedPersonas, botN:S.botN, st:S.st, myLog:S.myLog, fam:S.fam})); }
  makeBags();
  S.op = d.start; S.sus = Math.max(0, S.sus - 30); S.turn = 0; S.busy = false; S.open = []; S.sel = null;
  S.budget = d.budget; S.buffs = []; S.shield = 0; S.skcd = 0; S.echo = []; S.altTurn = -1; S.attemptBonus = 0;
  S.usedOnce = []; S.early = 0; S.accs.forEach(a => a.used = -99);
  // 선택 장면에 이름이 나오는 상대 고닉을 시작 댓글에 미리 깔아 둠
  { const m = /「([^」]+)」/.exec(d.dilemma?.t || ''); S.forceNick = m && (d.extraNicks||[]).includes(m[1]) ? m[1] : null; }
  $('#app').innerHTML = `
  <div class="win" id="hudwin"><div class="bar"><span>의뢰_0${S.r+1}.md</span><span class="ghost">작업일지.md</span><span>Lv.${level()}</span></div>
    <div class="body stack">
      <div class="mini"><span>⏳ <b id="turns"></b>턴</span><span>💰 작전비 <b id="budget"></b></span><span>👤 계정 <b id="accn"></b></span><span>📉 미답변 <b id="drain"></b></span></div>
      <div class="prog"><span>${esc(d.S)}</span><code id="opbar"></code><b id="opv"></b><span class="cmt">/ ${d.target}%</span></div>
      <div class="prog"><span>의심도</span><code class="w" id="susbar"></code><b id="susv"></b></div>
      <div class="buffs" id="buffs"></div>
      <div class="toasts" id="toasts"></div>
      <button class="btn settle" id="settle" hidden>✅ 목표 달성 — 지금 정산하기 <small></small></button>
    </div></div>
  ${renderBoard(d)}
  <div class="win"><div class="bar"><span>actions.md</span></div>
    <div class="body stack">
      <h3>계정</h3>
      <div class="chips" id="chips"></div>
      <div class="hrow"><h3>대응</h3></div>
      <div id="tgt"></div>
      <div class="tgrid">${Object.keys(TACTICS).map(k=>{ const T = TACTICS[k];
        const strong = Object.keys(FT).filter(x=>T.vs[x]===2).map(x=>[FT[x].icon+'에 강함',1]);
        return `<button class="tile tac" data-t="${k}"><span class="ic" style="background:${TAC_BG[k]}">${T.icon}</span><span class="nm">${T.name}</span><span class="fxs">${strong.map(chip).join('')}</span><span class="badge"></span></button>`; }).join('')}</div>
      <div class="hrow"><h3>${esc(SK().name)} 전용</h3><span class="cmt">// 무료 · 쓰고 나면 ${SKIN_CD}턴 쿨타임</span></div>
      <div class="ggrid">${(() => { const a = SKIN_ACTS[d.skin]; return `<button class="tile tool skinact" id="skinact"><span class="ic">${a.icon}</span><span class="nm">${a.name}</span><span class="fxs">${a.fx.map(chip).join('')}</span><span class="price" id="skincd">사용 가능</span></button>`; })()}</div>
      <div class="hrow"><h3>도구</h3><button class="fxbtn" id="fxbtn" aria-pressed="false">효과 보기</button></div>
      <div class="ggrid tools" id="tools">${TOOLS.filter(t=>t.lv<=level()).map(t=>`<button class="tile tool ${t.cost?'paid':''}" data-g="${t.id}" title="${esc(t.desc)}"><span class="ic">${t.icon}</span><span class="nm">${t.name}</span><span class="fxs">${TOOL_FX[t.id].map(chip).join('')}</span>${t.cost?`<span class="price">💰 ${won(t.cost)}</span>`:'<span class="price free">무료</span>'}</button>`).join('')}</div>
      ${(() => { const lk = TOOLS.filter(t=>t.lv>level()); if (!lk.length) return '<p class="cmt">// 모든 도구 해금 완료</p>';
        const nl = lk[0].lv; return `<div class="lockrow"><span class="lk">🔒 잠긴 도구 ${lk.length}개</span><span>다음 해금 <b>Lv.${nl}</b>: ${lk.filter(t=>t.lv===nl).map(t=>t.icon+' '+t.name).join(', ')}</span></div>`; })()}
    </div></div>
  <div class="status"><span class="br">⎇ main</span><span id="stline"></span><span>UTF-8</span><span>Markdown</span></div>`;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => reply(b.dataset.t));
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => useTool(b.dataset.g));
  $('#skinact').onclick = useSkinAct;
  $('#settle').onclick = settleEarly;
  $('#fxbtn').onclick = () => { const on = $('#tools').classList.toggle('showfx'); $('#fxbtn').textContent = on ? '효과 숨기기' : '효과 보기'; $('#fxbtn').setAttribute('aria-pressed', on); };
  const gi = $('#gimg'); if (gi && ART[d.art]){ const draw = () => ART[d.art](gi.getContext('2d')); draw(); document.fonts?.ready.then(draw); }
  const thk = d.thumb || SK().thumb, th = $('#thumb'); if (th && thk) drawPix(th, PIX[thk].rows, PIX[thk].pal);
  S.quiet = true; spawnFoe(); spawnFoe(); spawnFoe();
  autoAcc(); hud();
}

// 우리가 활동한 뒤에야 나올 수 있는 말 (알바·쉴드·감싸기·계정 의심 등). 시작할 때 깔리는 댓글에는 안 씀
const REACTIVE = /우셨|울었|그만해|그만하|이러는|이러지|리뷰 보|악플|공격|테러|몰아|조리돌|알바|쉴드|감싸|옹호|편드|편 드|계정|가입|IP|아이피|말투|부계|관계자|업자|찬양|칭찬 댓글|추천 수|공감 수|출근|퇴근|9시|6시|매뉴얼|리뷰 테러|별점 테러|리뷰 쓴|리뷰들|댓글들|몰려|홍보팀|대기 타|그 여론조사/;
function openingLine(type){
  for (let i = 0; i < 12; i++){ const t = B.foe[type].next(); if (!REACTIVE.test(t)) return t; }
  return null;
}
function spawnFoe(forceType, forceText){
  const d = ROUNDS[S.r];
  if (S.open.length >= BAL.maxOpen) return;
  const pool = []; for (const k in d.types) for (let i=0;i<d.types[k];i++) pool.push(k);
  const type = forceType || pick(pool);
  if (!forceText && S.quiet){ if (type === 'sus') return spawnFoe(pick(pool.filter(k=>k!=='sus')) || 'logic'); forceText = openingLine(type); if (!forceText) return spawnFoe(type === 'logic' ? 'crowd' : 'logic'); }
  const fn = S.forceNick; S.forceNick = null;
  const f = {id:++S.fid, type, hp:2, nick:fn || (SK().foeNick && SK().foeNick()) || B.nicks.next()};
  const el = document.createElement('div');
  el.className = 'c foe open'; el.tabIndex = 0; el.setAttribute('role','button');
  el.innerHTML = `<img alt="" src="${avatar(f.nick,'foe')}"><div class="x"><div class="n">${nickHtml(f.nick)} <span class="tag">${FT[type].icon} ${FT[type].name}</span> <span class="hp"></span></div><div class="t">${esc(forceText || B.foe[type].next())}</div><div class="meta">${SK().meta('foe')}</div><div class="replies"></div></div>`;
  el.onclick = () => select(f.id);
  el.onkeydown = e => { if (e.key==='Enter' || e.key===' '){ e.preventDefault(); select(f.id); } };
  f.el = el; S.open.push(f); drawHp(f);
  feedAdd(el);
}
function drawHp(f){ f.el.querySelector('.hp').textContent = '■'.repeat(Math.max(0,f.hp)); }
function feedAdd(el){ const fd = $('#feed'); if (!fd) return; fd.appendChild(el); fd.scrollTop = fd.scrollHeight; }
// 알림(이벤트·구매·경고)은 게시판 사이가 아니라 상태창 아래 알림 칸에. 최근 2개만 보임
function line(cls, text){
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast ' + cls; el.textContent = text;
  box.prepend(el); while (box.children.length > 2) box.lastChild.remove();
  [...box.children].forEach((c, i) => c.classList.toggle('old', i > 0));
}
function commentEl(nick, text, side){
  const el = document.createElement('div'); el.className = 'c ' + side;
  el.innerHTML = `<img alt="" src="${avatar(nick,side)}"><div class="x"><div class="n">${nickHtml(nick)}</div><div class="t">${esc(text)}</div><div class="meta">${SK().meta(side)}</div></div>`;
  return el;
}
function addReply(f, nick, text, side){ f.el.querySelector('.replies').appendChild(commentEl(nick,text,side)); const fd=$('#feed'); if (f.el===fd.lastElementChild) fd.scrollTop = fd.scrollHeight; }
function silence(f, nick, text){
  addReply(f, nick || f.nick, text || B.rep.give[f.type].next(), nick ? 'me' : 'foe');
  f.el.classList.remove('open','sel'); f.el.classList.add('done'); f.el.onclick = null; f.el.onkeydown = null;
  f.el.removeAttribute('tabindex'); f.el.removeAttribute('role');
  S.open = S.open.filter(x=>x!==f);
  if (S.sel === f.id) S.sel = null;
}

function select(id){
  if (S.busy) return;
  S.sel = S.sel===id ? null : id;
  document.querySelectorAll('.c.foe').forEach(e=>e.classList.remove('sel'));
  const f = S.open.find(x=>x.id===S.sel); if (f) f.el.classList.add('sel');
  hud();
}
function autoAcc(){ let best = 0; S.accs.forEach((a,i)=>{ if (a.used < S.accs[best].used) best = i; }); S.acc = best; }

function hud(){
  const d = ROUNDS[S.r];
  $('#opv').textContent = Math.round(S.op) + '%';
  $('#opbar').textContent = abar(S.op, d.target);
  $('#susbar').textContent = abar(S.sus);
  $('#stline').textContent = `Ln ${S.turn+1}, Col ${S.st.actions+1} · 의뢰 ${S.r+1}/${ROUNDS.length}`;
  $('#susv').textContent = Math.round(S.sus) + '/100';
  $('#turns').textContent = d.turns - S.turn;
  $('#budget').textContent = d.budget ? won(S.budget) : '없음';
  const bs = $('#bstat'); if (bs) bs.innerHTML = SK().stat();
  $('#ccount').textContent = document.querySelectorAll('#feed .c.me, #feed .c.foe').length;
  $('#drain').textContent = S.open.length + '개 (턴당 -' + S.open.reduce((s,f)=>s+FT[f.type].drain,0) + '%)';
  $('#buffs').innerHTML = S.buffs.map(b=>`<span>${b.label || '📹 바이럴 진행 중'} +${b.op}%/턴 · ${b.n}턴</span>`).join('') + (S.shield ? `<span>🔑 정지 면제 ${S.shield}턴</span>` : '');
  $('#accn').textContent = S.accs.length;
  $('#chips').innerHTML = S.accs.map((a,i)=>`<button class="chip ${i===S.acc?'on':''}" data-i="${i}"><img alt="" src="${avatar(a.nick,'me')}">@${esc(a.nick)} <small>#${esc(a.tone)}</small>${a.used===S.turn-1?'<small class="hot">방금 씀</small>':''}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { S.acc = +c.dataset.i; hud(); });
  const f = S.open.find(x=>x.id===S.sel);
  $('#tgt').className = f ? 'tgt on' : 'tgt';
  $('#tgt').innerHTML = f ? `🎯 대상 <b>@${esc(f.nick)}</b> <span class="tag2">${FT[f.type].icon} ${FT[f.type].name}</span> <span class="cmt">${S.r <= BAL.badgeUntil ? '// 초록 타일이 정답' : '// 이 유형에 강한 대응을 고르기'}</span>` : '👆 게시판에서 <b>상대 댓글</b>을 눌러 대상을 고르세요';
  document.querySelectorAll('[data-t]').forEach(b => { const v = f ? TACTICS[b.dataset.t].vs[f.type] : -1;
    const hint = S.r <= BAL.badgeUntil;
    b.disabled = !f || S.busy; b.classList.toggle('good', hint && v===2); b.classList.toggle('bad', hint && v===0);
    b.querySelector('.badge').textContent = !hint ? '' : v===2 ? '추천' : v===0 ? '역효과' : ''; });
  const sa = $('#skinact'); if (sa){ sa.disabled = S.busy || S.skcd > 0; sa.classList.toggle('poor', S.skcd > 0); $('#skincd').textContent = S.skcd > 0 ? `⏳ ${S.skcd}턴 뒤 사용 가능` : '✨ 사용 가능'; }
  document.querySelectorAll('[data-g]').forEach(b => { const t = TOOLS.find(x=>x.id===b.dataset.g); const poor = t.cost>S.budget, spent = t.once && S.usedOnce.includes(t.id);
    b.disabled = S.busy || t.lv>level() || poor || spent || (t.id === 'alt' && S.altTurn === S.turn); b.classList.toggle('poor', poor || spent);
    if (t.cost) b.querySelector('.price').textContent = spent ? '✔ 이번 의뢰에서 사용함' : poor ? '💸 작전비 부족' : '💰 ' + won(t.cost); });
  // 선택 장면이 지나고 목표를 넘겼으면 일찍 정산 가능
  const se = $('#settle'); if (se){ const ok = S.op >= d.target && S.turn >= 6 && S.turn < d.turns;
    se.hidden = !ok; se.disabled = S.busy; if (ok) se.querySelector('small').textContent = `남은 ${d.turns - S.turn}턴 × 보수 5% = +${won(earlyBonus())}`; }
}

function useAcc(){
  const a = S.accs[S.acc];
  if (a.used === S.turn-1){ S.sus += 7; line('sys','🕵️ "이 사람 방금 전에도 댓글 달았는데?"'); }
  a.used = S.turn; S.lastAcc = S.acc;
  return a;
}

function reply(t){
  const f = S.open.find(x=>x.id===S.sel); if (!f || S.busy) return;
  const T = TACTICS[t], m = T.vs[f.type], a = useAcc();
  S.st.actions++; S.st.replies++;
  const myLine = lineFor(a, B.my[t]); S.myLog.push({stage:S.r, text:myLine});
  addReply(f, a.nick, voice(a, myLine), 'me');
  if (m === 0){
    S.op -= 4; S.sus += T.sus + 6; S.st.back++;
    addReply(f, f.nick, B.rep[f.type][t].next(), 'foe');
    if (Math.random() < BAL.pileOn) spawnFoe('crowd', B.rep.pile.next());
    line('sys', `역효과! ${FT[f.type].name}한테 ${josa(T.name,'은','는')} 안 먹힌다.`);
  } else {
    f.hp -= m; S.op += T.op * (m === 2 ? BAL.strongMul : 1); S.sus += T.sus + S.r * BAL.susPerStage;
    if (t==='divert' && f.type==='sus') S.sus -= 8;
    if (m===2) S.st.strong++;
    if (f.hp <= 0){ silence(f, null, m === 2 ? B.rep[f.type][t].next() : B.rep.give[f.type].next());
      if (t !== 'mock' && (f.type === 'crowd' || Math.random() < BAL.echoChance)) S.echo.push({nick:f.nick, text:myLine, due:S.turn + 2}); }
    else { addReply(f, f.nick, B.rep[f.type][t].next(), 'foe'); drawHp(f); }
  }
  S.sel = null;
  endTurn();
}

const earlyBonus = () => Math.round((ROUNDS[S.r].turns - S.turn) * ROUNDS[S.r].pay * 0.05 / 1000) * 1000;
function settleEarly(){
  const d = ROUNDS[S.r];
  if (S.busy || S.op < d.target || S.turn < 6 || S.turn >= d.turns) return;
  S.early = earlyBonus(); S.busy = true; hud();
  line('evt', `✅ 의뢰인에게 "작업 끝났습니다" 보고를 보냈다. ${d.turns - S.turn}턴 일찍.`);
  setTimeout(screenResult, 600);
}

function useSkinAct(){
  if (S.busy || S.skcd > 0) return;
  S.st.actions++; S.st.skin = (S.st.skin||0) + 1;
  const msg = SKIN_ACTS[ROUNDS[S.r].skin].run();
  line('evt', msg);
  S.skcd = SKIN_CD + 1;
  S.sel = null;
  endTurn();
}

function useTool(id){
  const t = TOOLS.find(x=>x.id===id);
  if (S.busy || t.lv>level() || t.cost>S.budget) return;
  if (id === 'alt' && S.altTurn === S.turn) return;
  if (t.once){ if (S.usedOnce.includes(id)) return; S.usedOnce.push(id); }
  const d = ROUNDS[S.r];
  S.st.actions++;
  if (t.cost){ S.budget -= t.cost; S.st.tools++; S.st.spent += t.cost; }
  const buy = msg => line('buy', `💸 -${won(t.cost)} · ${msg}`);
  switch(id){
    case 'post': { const a = useAcc(); S.op += 6; S.sus += 5; const pl = lineFor(a, B.my.post); S.myLog.push({stage:S.r, text:pl}); feedAdd(commentEl(a.nick, '[새 글] ' + voice(a, pl), 'me')); break; }
    case 'boost': S.op += 4*S.accs.length; S.sus += 15; S.st.boosts++; line('evt', `👍 우리 쪽 댓글 추천 수가 갑자기 ${S.accs.length*37}개 올랐다.`); break;
    case 'alt': {
      const a = mkAcc(S.usedPersonas++); S.accs.push(a); S.sus += 4; S.st.alts++;
      feedAdd(commentEl(a.nick, voice(a, a.reg === 'casual' ? (SK().newbie || '오늘 가입함. 근데 댓글 읽어보니 생각 바뀜') : a.reg === 'polite' ? '오늘 가입했어요. 근데 댓글 읽어보니 생각이 바뀌네요' : (SK().newbie || '오늘 가입했어요. 근데 댓글 읽어보니 생각이 바뀌네요')), 'me')); S.altTurn = S.turn; hud(); return; }
    case 'lurk': S.sus -= 20; line('evt', pick(['💤 로그아웃하고 컵라면을 먹었다.','💤 유튜브 쇼츠를 40분 봤다.','💤 낮잠을 잤다. 꿈에서도 댓글을 달았다.'])); break;
    case 'meme': {
      S.op += 14; S.sus += 3;
      const f = S.open.find(x => x.type === 'anger' || x.type === 'crowd');
      if (f) silence(f, null, pick(['ㅋㅋㅋㅋ 아 이 짤은 인정','…짤 때문에 화가 풀려버렸네','이거 어디서 났음? 저장함']));
      buy(pick(['짤 장인이 만든 짤이 인기글에 올라갔다.','외주 짤이 생각보다 웃기다. 퍼지는 중.','짤 장인: "수정은 2번까지 무료입니다"']) + (f ? ' 화내던 사람 하나가 웃어버렸다.' : '')); break; }
    case 'macro': {
      S.op += 20; S.sus += 22;
      const f = S.open.find(x => x.id === S.sel) || S.open[0];
      if (f) silence(f, null, '(추천 수에 밀려 아래로 내려간 댓글)');
      buy('매크로가 추천을 1,200개 눌렀다. 1초 만에.' + (f ? ' 상대 댓글 하나가 아래로 묻혔다.' : '')); break; }
    case 'youtube': S.op += 6; S.sus += 3; S.buffs.push({n:3, op:8}); buy(`구독자 80만 유튜버가 "${d.Y}, 솔직히 말씀드립니다" 영상을 올렸다. (유료 광고 표시 없음)`); break;
    case 'admin': S.sus = 0; S.shield = 3; buy('운영자에게 기프티콘을 보냈다. 운영자: "음… 잠깐 자리 비우겠습니다."'); break;
    case 'press': {
      const logic = S.open.filter(f=>f.type==='logic').slice(0, BAL.pressMax);
      logic.forEach(f => silence(f, null, pick(['…기사로 나왔으면 맞겠지','언론이 그렇다니까 뭐','(삭제된 댓글입니다)'])));
      S.op += 6 + logic.length*5; S.sus = Math.max(0, S.sus - 15);
      buy(`[단독] "${d.Y}, 알고 보니…" 기사가 포털 메인에 걸렸다. 팩트형 ${logic.length}명이 조용해졌다.`); break; }
    case 'bots': {
      for (let i=0;i<3;i++){ const nick = BOT_NAMES[S.botN++ % BOT_NAMES.length] + (S.botN>BOT_NAMES.length ? S.botN : ''); S.accs.push({...BOT_PERSONA, nick, used:-99}); }
      S.st.alts += 3; S.sus += 18; buy('해외 봇 계정 3개가 입국했다. 한국어가 조금 이상하다.'); break; }
    case 'poll': S.op += 24; S.sus += 8; buy('"국민 10명 중 7명이 공감" 여론조사가 발표됐다. 무엇에 공감했는지는 질문지를 봐야 안다. 표본 수는 어디에도 없다.'); break;
    case 'portal': {
      const n = S.open.length; S.open.slice().forEach(f => silence(f, null, '(검색 결과에 노출되지 않는 게시물입니다)'));
      S.op += 10 + n*3; S.sus += 15; buy(`검색어 자동완성이 바뀌었다. 「${d.Y}」${josa(d.Y,'을','를').slice(d.Y.length)} 치면 「${d.Y} 조작」이 먼저 뜬다. 상대 댓글 ${n}개가 검색에서 사라졌다.`); break; }
  }
  S.sel = null;
  endTurn();
}

function endTurn(){
  const d = ROUNDS[S.r];
  S.quiet = false;
  S.busy = true; hud();
  setTimeout(()=>{
    S.open.forEach(f => { S.op -= FT[f.type].drain; if (f.type==='sus') S.sus += 3; });
    S.buffs.forEach(b => { S.op += b.op; b.n--; }); S.buffs = S.buffs.filter(b=>b.n>0);
    // 설득당한 사람이 내 문장을 그대로 퍼 나름
    S.echo.filter(e => e.due <= S.turn).forEach(e => {
      const el = commentEl(e.nick, e.text, 'ally');
      el.querySelector('.n').insertAdjacentHTML('beforeend', ' <span class="tag echo">🔁 퍼 나름</span>');
      feedAdd(el); S.op += BAL.echoOp; S.st.echo++;
    });
    S.echo = S.echo.filter(e => e.due > S.turn);
    const rate = d.fading ? d.spawn * (1 - 0.5 * S.turn/d.turns) : d.spawn;
    const x = rate * BAL.spawnMul + BAL.spawnAdd; for (let i = 0; i < Math.floor(x); i++) spawnFoe(); if (Math.random() < x % 1) spawnFoe();
    if (d.fading && S.turn === 8) line('evt', '⚡ 단골 몇 명이 "이제 리뷰 안 볼래요"라고 남기고 떠났다.');
    if (Math.random() < .22){ const e = B.events.next(); S.op += e.op; S.sus += e.sus; line('evt', '⚡ ' + e.t); }
    S.sus = clamp(S.sus - 3, 0, 100); S.op = clamp(S.op, 0, 100);
    if (S.shield){ S.shield--; S.sus = Math.min(S.sus, 99); }
    if (S.skcd) S.skcd--;
    S.turn++;
    if (S.sus >= 100 && banCheck()) return;
    autoAcc();
    S.busy = false; hud();
    if (S.turn === 3 && S.r >= 5 && !S.fam && S.myLog.some(x => x.stage < S.r)) return showFamily();
    if (S.turn === 6) return showDilemma();
    if (S.turn >= d.turns){ S.busy = true; hud(); setTimeout(screenResult, 700); }
  }, 450);
}

function banCheck(){
  const i = S.lastAcc ?? S.acc;
  const a = S.accs.splice(Math.min(i, S.accs.length-1), 1)[0];
  S.st.bans++; S.sus = 40;
  line('sys', `🚫 운영자: 「${a.nick}」 님은 여론 조작 의심으로 이용 정지되었습니다.`);
  const h = $('#hudwin'); h.classList.remove('shake'); void h.offsetWidth; h.classList.add('shake');
  if (!S.accs.length){ hud(); setTimeout(()=>screenEnding('banned'), 900); return true; }
  return false;
}

/* 가족 단톡방: 예전에 내가 쓴 문장이 그대로 엄마한테까지 돌아옴 (한 판에 한 번, 6단계 이후) */
function showFamily(){
  S.busy = true; hud();
  const past = S.myLog.filter(x => x.stage < S.r);
  const crossed = S.crossed.filter(r => r < S.r && ROUNDS[r].smear);
  const played = [...new Set(past.map(x => x.stage))].filter(r => ROUNDS[r].smear);
  const st = crossed.length ? pick(crossed) : pick(played.filter(r => r >= 1).length ? played.filter(r => r >= 1) : played);
  const quote = ROUNDS[st].smear, mine = pick(past.filter(x => x.stage === st)).text, ago = S.r - st;
  const ov = document.createElement('div'); ov.className = 'overlay fam';
  ov.innerHTML = `<div class="famchat" role="dialog" aria-modal="true" aria-label="가족 단톡방">
    <div class="fhead"><span>‹</span><b>우리 가족 4</b><span>☰</span></div>
    <div class="fbody">
      <div class="fday">오늘</div>
      <div class="fmsg"><span class="who">엄마</span><div class="fwd"><span>↪ 전달된 메시지</span><p>${esc(quote)}</p></div></div>
      <div class="fmsg"><span class="who">엄마</span><div class="bub">이거.진짜래??너도.조심하거라..^^</div></div>
      <div class="fmsg"><span class="who">아빠</span><div class="bub">요즘.인터넷.보면.다맞는말이더라.</div></div>
      <div class="fmsg"><span class="who">아빠</span><div class="bub">${pick(['네모.당','동글.당'])} 알밥들이많다.조심하거라..!</div></div>
      <div class="fmsg"><span class="who">동생</span><div class="bub">ㅋㅋ 이런 거 다 알바가 쓰는 거임</div></div>
      <div class="fmsg"><span class="who">엄마</span><div class="bub">얘는.무슨~~ 벌써.공감이 3천개야..^^;;</div></div>
      <div class="fnote">${crossed.includes(st) ? `${ago}달 전, 당신이 퍼뜨린 이야기에서 시작됐다. 그사이 누군가 살을 붙였다.` : `${ago}달 전 당신이 쓴 문장에서 시작된 이야기다. 중간에 누군가 살을 붙였다.<br><span class="orig">당신이 쓴 원래 문장: "${esc(mine)}"</span>`}</div>
    </div>
    <div class="fbtns"><button class="btn alt" id="fa">읽음 표시만 남긴다</button><button class="btn" id="fb">"응, 맞대"라고 보낸다</button></div>
  </div>`;
  document.body.appendChild(ov);
  $('#fa').focus();
  const done = reply => { if (S.fam) return; ov.remove(); S.fam = reply;
    line(reply === 'yes' ? 'sys' : 'evt', reply === 'yes' ? '→ 엄마가 하트 이모티콘을 보냈다. 그 문장은 단톡방 공지로 고정됐다.' : '→ 당신은 휴대폰을 엎어 놓았다. 단톡방 숫자 1은 금방 사라졌다.');
    if (reply === 'yes') S.karma++;
    S.busy = false; hud(); };
  $('#fa').onclick = () => done('read');
  $('#fb').onclick = () => done('yes');
}

function showDilemma(){
  const d = ROUNDS[S.r], q = d.dilemma;
  S.busy = true; hud();
  const arrows = (v, up, down) => v >= 20 ? up.repeat(3) : v >= 10 ? up.repeat(2) : v > 0 ? up : v === 0 ? '변화 없음' : v <= -10 ? down.repeat(2) : down;
  const fx = c => `
    <li class="${c.op>0?'pos':c.op<0?'neg':''}">여론 <b>${arrows(c.op,'▲','▼')}</b></li>
    <li class="${c.sus>0?'neg':c.sus<0?'pos':''}">의심 <b>${arrows(c.sus,'▲','▼')}</b></li>
    ${c.money ? `<li class="pos">보너스 <b>+${won(c.money)}</b></li>` : ''}
    ${c.karma ? '<li class="cross">⚠ 선을 넘음</li>' : '<li class="keep">선은 지킴</li>'}`;
  const ov = document.createElement('div'); ov.className = 'overlay dil';
  ov.innerHTML = `<div class="conflict" role="dialog" aria-modal="true" aria-labelledby="dq">
    <div class="cbar"><span>⚠ MERGE CONFLICT</span><span>선택.md · 의뢰 ${S.r+1} · 턴 ${S.turn}</span></div>
    <div class="cbody">
      <div class="dm"><img alt="" src="${avatar(d.client,'foe')}"><div><div class="from">${esc(d.client)}</div><p id="dq">${esc(q.t)}</p></div></div>
      ${(() => { const nb = (BILLS[S.r+1]||[]).reduce((a,[,v])=>a+v, 0); if (!nb) return '';
        return `<p class="wallet">💳 지금 통장 <b>${won(S.money)}</b> · 다음 달 청구서 <b>${won(nb)}</b> + 이번 달 수입의 ${Math.round(LIFESTYLE*100)}%${S.money < nb ? ` <span class="short">→ 고정비만 ${won(nb - S.money)} 모자람</span>` : ''}</p>`; })()}
      <div class="choices">
        <button class="choice cross" id="da"><span class="mk">&lt;&lt;&lt;&lt;&lt;&lt;&lt; 선 넘기</span><span class="lb">${esc(q.a.l)}</span><ul>${fx(q.a)}</ul><span class="go">Accept ▶</span></button>
        <div class="sep" aria-hidden="true">=======</div>
        <button class="choice keep" id="db"><span class="mk">&gt;&gt;&gt;&gt;&gt;&gt;&gt; 참기</span><span class="lb">${esc(q.b.l)}</span><ul>${fx(q.b)}</ul><span class="go">Accept ▶</span></button>
      </div>
      <p class="karma">// 지금까지 선을 넘은 횟수: <b>${S.karma}</b>번</p>
    </div></div>`;
  document.body.appendChild(ov);
  $('#da').focus();
  let picked = false;
  const choose = c => {
    if (picked) return; picked = true;
    ov.remove();
    S.op = clamp(S.op + c.op, 0, 100); S.sus = clamp(S.sus + c.sus, 0, 100); S.karma += c.karma; S.money += c.money || 0;
    if (c.karma) S.crossed.push(S.r);
    if (c.money) S.attemptBonus = (S.attemptBonus||0) + c.money;
    line(c.karma ? 'sys' : 'evt', '→ ' + c.log);
    if (S.sus >= 100 && !S.shield && banCheck()) return;
    S.busy = false; hud();
  };
  $('#da').onclick = () => choose(q.a);
  $('#db').onclick = () => choose(q.b);
}

/* ---------- 결과 / 레벨업 / 엔딩 ---------- */
function screenResult(){
  const d = ROUNDS[S.r];
  const win = S.op >= d.target;
  const last = S.r === ROUNDS.length - 1;
  let pay = 0, over = 0, kept = 0, early = 0;
  if (win){ over = Math.round((S.op - d.target) * d.pay / 50); pay = d.pay; kept = Math.round(S.budget * BAL.keepBudget / 1000) * 1000; early = S.early || 0;
    S.money += pay + over + kept + early; S.st.wins++;
    S.lastIncome = pay + over + kept + early + (S.attemptBonus || 0); }
  const news = last ? (win ? d.newsWin : d.newsLose) : (win ? d.news : null);
  const fired = !win && S.fails >= 1;
  $('#app').innerHTML = `
  <div class="win"><div class="bar"><span>정산_0${S.r+1}.md</span><span class="num">${won(S.money)}</span></div>
  <div class="body stack">
    <h2>${win ? '의뢰 성공' : '의뢰 실패'}</h2>
    <p>최종 여론 <b>${Math.round(S.op)}%</b> (목표 ${d.target}%)</p>
    <div class="memo"><span>${win ? esc(d.win) : fired ? '의뢰인: "두 번은 안 봐줍니다."' : '의뢰인: "한 번만 더 기회 드릴게요. 작전비는 다시 드립니다."'}</span>
      ${win ? `<span class="k">정산 내역</span>
        <span class="bi"><span>성공 보수</span><b>+${won(pay)}</b></span>
        ${over ? `<span class="bi"><span>초과 달성 보너스</span><b>+${won(over)}</b></span>` : ''}
        ${early ? `<span class="bi"><span>조기 정산 보너스</span><b>+${won(early)}</b></span>` : ''}
        ${kept ? `<span class="bi"><span>남은 작전비 (절반은 의뢰인에게 반납)</span><b>+${won(kept)}</b></span>` : ''}
        ${S.attemptBonus ? `<span class="bi"><span>선 넘기 보너스 (받아 둔 돈)</span><b>+${won(S.attemptBonus)}</b></span>` : ''}
        <span class="bi tot"><span>이번 달 수입</span><b>${won(pay + over + kept + early + (S.attemptBonus||0))}</b></span>` : '<span class="big">+0원</span>'}</div>
    ${news ? `<div class="memo"><span class="k">${esc(news.k)}</span><span class="big">${esc(news.t)}</span><span>${esc(news.q)}</span></div>` : ''}
    <p class="dim">${esc(SKINS[d.skin].name)} 접속자 <span class="num">${users().toLocaleString()}</span>명</p>
    <div class="row"><button class="btn" id="go">${last || fired ? '로그아웃' : win ? '다음' : '재도전'}</button></div>
  </div></div>`;
  $('#go').onclick = () => {
    if (fired) return screenEnding('fired');
    if (last) return screenEnding('clear');
    if (win){ S.fails = 0; S.r++; screenLevelUp(); }
    else { S.fails++;
      // 재도전: 계정·의심도 등은 의뢰 시작 때로 되돌리지만, 넘은 선과 그 대가(보너스 돈)는 되돌릴 수 없다
      const keep = {karma:S.karma, crossed:S.crossed.slice(), bonus:S.attemptBonus||0, fam:S.fam};
      Object.assign(S, JSON.parse(JSON.stringify(S.cp)));
      S.karma = keep.karma; S.crossed = keep.crossed; S.money += keep.bonus; S.fam = keep.fam;
      screenBrief(); }
  };
}

/* 다음 의뢰로 넘어갈 때마다 오는 청구서. 버는 만큼 생활 수준도 올라간다 (index = 새로 시작할 단계) */
const BILLS = [null,
  [['월세 부족분', 15000]],
  [['밀린 카드값', 40000], ['새 모니터 할부', 30000]],
  [['월세', 100000], ['게이밍 의자 할부', 60000]],
  [['외제차 리스', 300000], ['월세', 150000]],
  [['강남 오피스텔 월세', 1000000], ['명품 시계 할부', 1000000]],
  [['변호사 선임비 (혹시 몰라서)', 5000000], ['오피스텔 월세', 1000000]],
];
const LIFESTYLE = 0.45; // 지난달 수입 중 늘어난 씀씀이로 나가는 비율
function payBills(){
  const items = (BILLS[S.r] || []).slice();
  if (items.length && S.lastIncome) items.push([`늘어난 씀씀이 (지난달 수입의 ${Math.round(LIFESTYLE*100)}%)`, Math.round(S.lastIncome * LIFESTYLE / 1000) * 1000]);
  const total = items.reduce((a,[,v])=>a+v, 0), before = S.money;
  let sold = null;
  if (S.money >= total){ S.money -= total; }
  else { if (S.accs.length > 1){ sold = S.accs.pop(); S.st.sold++; } S.money = 0; }
  S.st.bills += Math.min(before, total);
  return {items, total, before, sold};
}
function screenLevelUp(){
  const bill = payBills();
  const nu = TOOLS.filter(t=>t.lv===level());
  const d = ROUNDS[S.r];
  $('#app').innerHTML = `
  <div class="win"><div class="bar"><span>CHANGELOG.md</span><span class="num">${won(S.money)}</span></div>
  <div class="body stack">
    <h2>Lv.${level()} 달성</h2>
    ${ladder()}
    <p>소문이 났다. 이번엔 <b>${esc(d.tier)}</b>에서 연락이 왔다.</p>
    ${bill.items.length ? `<div class="memo bill"><span class="k">📬 이번 달 청구서</span>
      ${bill.items.map(([n,v])=>`<span class="bi"><span>${esc(n)}</span><b>${won(v)}</b></span>`).join('')}
      <span class="bi tot"><span>합계</span><b>${won(bill.total)}</b></span>
      <span>내 돈 ${won(bill.before)} → <b>${won(S.money)}</b></span>
      ${bill.sold ? `<span class="warnline">돈이 모자라 부계정 「${esc(bill.sold.nick)}」${josa(bill.sold.nick,'을','를').slice(bill.sold.nick.length)} 업자에게 팔아 메꿨다. (남은 계정 ${S.accs.length}개)</span>` : bill.before < bill.total ? `<span class="warnline">돈이 모자랐다. 팔 계정도 없어서 카드 돌려막기를 시작했다.</span>` : ''}
    </div>` : ''}
    ${S.r === BAL.badgeUntil + 1 ? `<p class="dim">// 이제부터는 "추천" 표시가 없어요. 대응 타일의 상성 칩(🧠 강함 등)을 보고 직접 고르세요.</p>` : ''}
    ${nu.length ? `<p class="dim">새로 쓸 수 있는 도구</p><div class="unlock">${nu.map(t=>`<div><b>${t.icon} ${t.name}</b><span>${esc(t.desc)}</span><span class="cash">${won(t.cost)}</span></div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn" id="go">의뢰 확인</button></div>
  </div></div>`;
  $('#go').onclick = screenBrief;
}

function screenEnding(kind){
  const st = S.st;
  const lines = kind === 'banned' ? [
    '모든 계정이 정지됐다.',
    '다음 날, 같은 의뢰가 다른 사람에게 갔다.',
    '그 사람은 당신보다 건당 500원 싸게 일하기로 했다.',
    '게시판은 아무 일 없었다는 듯 계속 싸우고 있었다. 그 사람이 쓴 글로.',
  ] : kind === 'fired' ? [
    '같은 의뢰를 두 번 망쳤다.',
    '업계에 소문이 났다. "그 사람 요즘 감 떨어졌대."',
    '의뢰 연락이 더 이상 오지 않는다.',
    '대신 당신이 쓰던 닉네임으로 누군가 계속 댓글을 달고 있다.',
  ] : [
    `${ROUNDS[0].payNote}에서 시작해 ${won(S.money)}을 벌었다.`,
    '정산 내역을 보다가 이상한 점을 발견했다.',
    `지난달엔 ${josa(ROUNDS[5].who,'을','를')} 위해, 이번 달엔 ${josa(ROUNDS[6].who,'을','를')} 위해 일했다. 같은 계정들로.`,
    S.karma === 0 ? `당신은 끝까지 선은 안 넘었다고 생각했다. 그래도 ${ROUNDS[3].loss}.`
                  : S.karma === 1 ? '선을 넘은 건 딱 한 번이었다. 그 한 번이 어디까지 퍼졌는지는 아무도 모른다.'
                  : `당신이 선을 넘은 횟수: ${S.karma}번. 기억나는 건 그중 하나도 없었다.`,
    `처음 부탁했던 ${friendLabel()}${josa(FRIEND,'은','는').slice(FRIEND.length)} 언제부턴가 갤에 들어오지 않는다.`,
    '당신과 싸우던 사람들, 당신 편을 들던 사람들, 그 글을 퍼 나르던 사람들.',
    ...(st.echo ? [`당신이 쓴 문장을 토씨 하나 안 바꾸고 옮겨 적은 사람만 ${st.echo}명이었다.`] : []),
    ...(S.fam === 'yes' ? ['가족 단톡방 공지에는 아직도 당신이 쓴 문장이 걸려 있다.'] : S.fam === 'read' ? ['엄마는 그 문장을 다른 단톡방에도 보냈다고 했다.'] : []),
    '처음 글을 쓴 사람은 언제나 한 명이었다. 나머지는 전부, 그 글을 믿었다.',
  ];
  const finalLine = kind === 'clear' ? '여론은 바뀌었다.<br>쓴 사람은 단 한 명이었다.' : '살아남는 키보드는 하나뿐이다.<br>이번엔 당신이 아니었다.';
  const D = 1.1;
  $('#app').innerHTML = `
  <div class="win"><div class="bar"><span>${kind==='clear' ? 'ENDING.md' : 'GAME_OVER.md'}</span><span class="num">${won(S.money)}</span></div>
  <div class="body stack ending">
    ${lines.map((l,i)=>`<p class="line" style="animation-delay:${i*D}s">${esc(l)}</p>`).join('')}
    <p class="line final" style="animation-delay:${lines.length*D+.4}s">${finalLine}</p>
    <p class="line sig" style="animation-delay:${lines.length*D+1.0}s"><b>키보드 하이랜더</b> — <i>There can be only one.</i></p>
    <div class="stats line" style="animation-delay:${lines.length*D+1.4}s">
      <span class="dim">최종 레벨</span><span class="num">Lv.${level()}</span>
      <span class="dim">단 답글 / 한 방 제압</span><span class="num">${st.replies} / ${st.strong}</span>
      <span class="dim">역효과</span><span class="num">${st.back}</span>
      <span class="dim">쓴 도구 / 쓴 작전비</span><span class="num">${st.tools} / ${won(st.spent)}</span>
      <span class="dim">만든 계정 / 정지</span><span class="num">${st.alts} / ${st.bans}</span>
      <span class="dim">선을 넘은 횟수</span><span class="num">${S.karma}</span>
      <span class="dim">내 문장을 퍼 나른 사람</span><span class="num">${st.echo}명</span>
      <span class="dim">낸 생활비 / 팔아넘긴 계정</span><span class="num">${won(st.bills)} / ${st.sold}</span>
      <span class="dim">성공한 의뢰</span><span class="num">${st.wins} / ${ROUNDS.length}</span>
    </div>
    <div class="line" style="animation-delay:${lines.length*D+1.8}s">${surveyHtml()}</div>
    <div class="row line" style="animation-delay:${lines.length*D+2.0}s"><button class="btn" id="go">처음부터</button></div>
  </div></div>`;
  $('#go').onclick = screenTitle;
  bindSurvey(kind);
}

/* ---------- 엔딩 리뷰 (4지선다 4문항) ----------
   FEEDBACK.url에 구글 설문 응답 주소(…/formResponse)와 문항별 entry 번호를 넣으면 자동 수집.
   비워두면 "결과 복사" 후 카톡 등으로 보내는 방식 */
const VERSION = '0.17';
const FEEDBACK = { url:'', entries:{ q1:'', q2:'', q3:'', q4:'', info:'' } };
const SURVEY = [
  {id:'q1', q:'난이도는 어땠어요?', a:['너무 쉬움','적당함','좀 어려움','너무 어려움']},
  {id:'q2', q:'제일 재밌었던 건?', a:['플랫폼별 화면','댓글 상성 싸움','선 넘기 선택지','엔딩 반전']},
  {id:'q3', q:'댓글 반응, 현실이랑 비슷했어요?', a:['완전 현실','꽤 비슷','좀 어색','많이 어색']},
  {id:'q4', q:'다시 해볼 생각 있어요?', a:['지금 바로','업데이트되면','친구한테 추천함','별로']},
];
const surveyHtml = () => `<div class="survey" id="survey">
  <h2>리뷰 좀 부탁드려요 <span class="dim">(10초)</span></h2>
  ${SURVEY.map(s=>`<div class="sq"><p>${esc(s.q)}</p><div class="sopts">${s.a.map((a,i)=>`<button class="sopt" data-q="${s.id}" data-i="${i}">${esc(a)}</button>`).join('')}</div></div>`).join('')}
  <div class="row"><button class="btn" id="ssend" disabled>리뷰 보내기</button><span class="dim" id="smsg">4개 다 고르면 보낼 수 있어요</span></div>
  <textarea id="scopy" readonly hidden></textarea>
</div>`;
function bindSurvey(kind){
  const ans = {};
  document.querySelectorAll('.sopt').forEach(b => b.onclick = () => {
    ans[b.dataset.q] = +b.dataset.i;
    document.querySelectorAll(`.sopt[data-q="${b.dataset.q}"]`).forEach(x => x.classList.toggle('on', x === b));
    const n = Object.keys(ans).length; $('#ssend').disabled = n < SURVEY.length;
    $('#smsg').textContent = n < SURVEY.length ? `${SURVEY.length - n}개 남았어요` : '준비 완료';
  });
  $('#ssend').onclick = () => {
    const info = `v${VERSION} · ${kind === 'clear' ? '엔딩' : '게임오버'} · Lv.${level()} · 성공 ${S.st.wins}/${ROUNDS.length} · 선 넘음 ${S.karma}번`;
    const text = `[키보드 하이랜더 리뷰]\n${info}\n` + SURVEY.map(s => `${s.q} → ${s.a[ans[s.id]]}`).join('\n');
    const done = msg => { $('#ssend').disabled = true; $('#ssend').textContent = '고마워요!'; $('#smsg').textContent = msg; document.querySelectorAll('.sopt').forEach(x => x.disabled = true); };
    // 1순위: 게임 서버(Cloudflare)에 저장. 안 되면(저장소 미설정·파일로 열기 등) 아래 방식으로
    const copyFallback = () => {
      const ta = $('#scopy'); ta.value = text; ta.hidden = false;
      const fb = () => { ta.focus(); ta.select(); done('아래 글을 길게 눌러 복사한 뒤 카톡으로 보내주세요.'); };
      try { navigator.clipboard.writeText(text).then(() => done('복사됐어요! 카톡으로 보내주세요.'), fb); } catch(e){ fb(); }
    };
    $('#ssend').disabled = true; $('#smsg').textContent = '보내는 중…';
    const payload = {v:VERSION, info, a:Object.fromEntries(SURVEY.map(s => [s.id, s.a[ans[s.id]]]))};
    fetch('/api/review', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(payload)})
      .then(r => r.ok ? done('리뷰가 저장됐어요. 고마워요!') : Promise.reject())
      .catch(() => FEEDBACK.url ? sendForm() : copyFallback());
    return;
    function sendForm(){
      const fd = new FormData(); SURVEY.forEach(s => FEEDBACK.entries[s.id] && fd.append(FEEDBACK.entries[s.id], s.a[ans[s.id]]));
      if (FEEDBACK.entries.info) fd.append(FEEDBACK.entries.info, info);
      fetch(FEEDBACK.url, {method:'POST', mode:'no-cors', body:fd}).then(() => done('리뷰가 전달됐어요.'), copyFallback);
    }
  };
}

screenTitle();
</script>
